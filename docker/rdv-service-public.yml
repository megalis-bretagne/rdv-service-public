---
name: rdv-service-public

services:
  app:
    image: rdv-service-public:latest
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: ${POSTGRES_HOST}
    depends_on:
      - db
      - redis
    ports:
      - 3000:3000
    networks:
      - rsp-network
    
  db:
    image: postgres:17.4-alpine3.21
    restart: always
    shm_size: 128mb
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - 5432:5432
    networks:
      - rsp-network
    volumes:
      - db-data:/var/lib/postgresql/data

  redis:
    image: redis:7.4.2-alpine3.21
    networks:
      - rsp-network

networks:
  rsp-network:
    name: rdv-service-public

volumes:
  db-data:

...
